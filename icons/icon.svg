<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tabGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="tabGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景ベース -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bgGrad)" stroke="#6366F1" stroke-width="2" stroke-opacity="0.35" filter="url(#shadow)"/>

  <!-- 上タブ (Tab 1) -->
  <rect x="16" y="22" width="56" height="34" rx="7" fill="url(#tabGrad1)"/>
  <circle cx="25" cy="39" r="5" fill="#C7D2FE"/>
  <rect x="36" y="36" width="24" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- 下タブ (Tab 2) -->
  <rect x="16" y="72" width="56" height="34" rx="7" fill="url(#tabGrad2)"/>
  <circle cx="25" cy="89" r="5" fill="#BAE6FD"/>
  <rect x="36" y="86" width="24" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- ソート矢印群 -->
  <!-- 昇順矢印 (上向き・エメラルドグリーン) -->
  <g stroke="#34D399" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="87" y1="68" x2="87" y2="26"/>
    <polyline points="78.5,34.5 87,26 95.5,34.5"/>
  </g>

  <!-- 降順矢印 (下向き・アンバーイエロー) -->
  <g stroke="#FBBF24" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="107" y1="60" x2="107" y2="102"/>
    <polyline points="98.5,93.5 107,102 115.5,93.5"/>
  </g>
</svg>
